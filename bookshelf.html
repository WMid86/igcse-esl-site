<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>DSAS Reading Library — Bookshelf</title>
  <style>
    :root {
      --wood-dark:   #5c3d1e;
      --wood-mid:    #7a5230;
      --wood-light:  #a0723a;
      --wood-edge:   #3d2610;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: radial-gradient(ellipse at 60% 0%, #1e3a5c 0%, #0d1f35 60%, #080f1a 100%);
      min-height: 100vh;
      color: #fff;
      overflow-x: hidden;
    }

    /* ── Header ── */
    .header { text-align: center; padding: 48px 20px 16px; }
    .header h1 { font-size: clamp(1.6rem,4vw,2.6rem); font-weight:900; letter-spacing:-.02em; }
    .header p  { color:rgba(255,255,255,.55); margin-top:8px; font-size:.95rem; }
    .level-legend { display:flex; justify-content:center; flex-wrap:wrap; gap:10px; margin:20px auto 0; max-width:700px; }
    .level-pill   { padding:5px 14px; border-radius:20px; font-size:.78rem; font-weight:700; letter-spacing:.04em; border:1.5px solid rgba(255,255,255,.2); }

    /* ── Bookcase outer shell ── */
    .shelf-room {
      margin: 40px auto 60px;
      padding: 0 20px;
      display: flex;
      justify-content: center;
    }

    /* The whole bookcase — one continuous unit */
    .bookcase {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      /* Side panels */
      border-left:  18px solid var(--wood-dark);
      border-right: 18px solid var(--wood-dark);
      border-top:   14px solid var(--wood-mid);
      border-bottom:22px solid var(--wood-edge);
      border-radius: 4px;
      background: #1a0e06; /* back panel */
      box-shadow:
        -4px 0 0 var(--wood-edge),
         4px 0 0 var(--wood-edge),
         0 12px 40px rgba(0,0,0,.7),
         inset 2px 0 6px rgba(0,0,0,.4),
         inset -2px 0 6px rgba(0,0,0,.4);
      overflow: visible;
    }
    /* Left side grain highlight */
    .bookcase::before {
      content:'';
      position: absolute;
      top:0; left:-18px; width:18px; height:100%;
      background: linear-gradient(90deg, var(--wood-edge) 0%, var(--wood-mid) 40%, var(--wood-dark) 100%);
      border-radius: 3px 0 0 3px;
      pointer-events: none;
    }
    /* Right side grain */
    .bookcase::after {
      content:'';
      position: absolute;
      top:0; right:-18px; width:18px; height:100%;
      background: linear-gradient(90deg, var(--wood-dark) 0%, var(--wood-mid) 60%, var(--wood-edge) 100%);
      border-radius: 0 3px 3px 0;
      pointer-events: none;
    }

    .shelf-section { margin-bottom: 0; display: flex; flex-direction: column; }

    .shelf-label {
      padding: 6px 14px 4px;
      font-size: .7rem; font-weight:700; letter-spacing:.1em;
      text-transform:uppercase; opacity:.5; color:#fff;
    }

    /* Each plank — horizontal shelf inside the bookcase */
    .shelf-plank {
      position: relative;
      background: linear-gradient(180deg,
        var(--wood-light) 0%,
        var(--wood-mid)   40%,
        var(--wood-dark)  100%
      );
      padding: 0 10px;
      display: flex;
      align-items: flex-end;
      gap: 4px;
      box-shadow:
        inset 0 2px 4px rgba(255,255,255,.12),
        0 6px 0 var(--wood-edge),
        0 8px 16px rgba(0,0,0,.5);
      /* grain lines */
      background-image:
        linear-gradient(180deg, var(--wood-light) 0%, var(--wood-mid) 40%, var(--wood-dark) 100%),
        repeating-linear-gradient(90deg, transparent 0px, transparent 55px, rgba(0,0,0,.035) 55px, rgba(0,0,0,.035) 57px);
      background-blend-mode: multiply;
    }

    /* The thick front lip of each shelf */
    .shelf-edge {
      height: 10px;
      background: linear-gradient(180deg, var(--wood-edge) 0%, #0e0703 100%);
      box-shadow: 0 3px 10px rgba(0,0,0,.6);
      margin-bottom: 0;
    }

    /* ── Book spine ── */
    .book {
      position:relative; bottom:0; flex-shrink:0;
      width:42px;
      border-radius:3px 3px 0 0;
      cursor:pointer;
      transition:transform .2s ease, filter .2s ease;
      transform-origin:bottom center;
      box-shadow:-2px 0 6px rgba(0,0,0,.4), inset -3px 0 6px rgba(0,0,0,.2);
    }
    .book:hover { transform:translateY(-22px) scale(1.06); filter:brightness(1.2); z-index:10; }
    .book-inner {
      width:100%; height:100%; border-radius:3px 3px 0 0;
      display:flex; align-items:center; justify-content:center;
      padding:8px 4px; position:relative; overflow:hidden;
    }
    .book-inner::before {
      content:''; position:absolute; top:0; left:0;
      width:6px; height:100%;
      background:linear-gradient(90deg,rgba(255,255,255,.2) 0%,transparent 100%);
      border-radius:3px 0 0 0;
    }
    .book-title-spine {
      writing-mode:vertical-rl; text-orientation:mixed; transform:rotate(180deg);
      font-size:.66rem; font-weight:700; color:rgba(255,255,255,.92);
      text-shadow:0 1px 3px rgba(0,0,0,.6); line-height:1.2; letter-spacing:.03em;
      max-height:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      width:100%; text-align:center;
    }

    /* ── Tooltip ── */
    .book-tooltip {
      position:absolute; bottom:calc(100% + 16px); left:50%; transform:translateX(-50%);
      background:rgba(8,16,28,.98); border:1px solid rgba(255,255,255,.15);
      border-radius:14px; padding:0; width:180px; z-index:200;
      pointer-events:none; opacity:0; transition:opacity .15s;
      box-shadow:0 12px 40px rgba(0,0,0,.7); overflow:hidden;
    }
    .book:hover .book-tooltip { opacity:1; }
    .book-tooltip::after {
      content:''; position:absolute; top:100%; left:50%; transform:translateX(-50%);
      border:7px solid transparent; border-top-color:rgba(8,16,28,.98);
    }
    .tt-cover {
      width:100%; height:140px; object-fit:cover; object-position:top;
      display:block; background:#1a2a3a;
    }
    .tt-body { padding:10px 12px 12px; }
    .tt-title  { font-size:.82rem; font-weight:800; color:#fff; margin-bottom:3px; line-height:1.25; }
    .tt-author { font-size:.72rem; color:rgba(255,255,255,.55); margin-bottom:7px; }
    .tt-meta   { display:flex; gap:5px; flex-wrap:wrap; }
    .tt-badge  { font-size:.68rem; font-weight:700; padding:2px 7px; border-radius:8px; background:rgba(255,255,255,.1); color:rgba(255,255,255,.75); }
    .tt-cta    { margin-top:7px; font-size:.7rem; color:rgba(255,255,255,.35); }

    /* ── Modal ── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,.8); z-index:1000;
      display:flex; align-items:center; justify-content:center; padding:20px;
      opacity:0; pointer-events:none; transition:opacity .25s;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:linear-gradient(135deg,#1a2f4a 0%,#0f1e30 100%);
      border:1px solid rgba(255,255,255,.12); border-radius:22px;
      max-width:520px; width:100%; position:relative;
      transform:translateY(20px) scale(.97); transition:transform .25s;
      box-shadow:0 24px 80px rgba(0,0,0,.8); overflow:hidden;
    }
    .modal-overlay.open .modal { transform:translateY(0) scale(1); }
    .modal-close {
      position:absolute; top:14px; right:14px;
      background:rgba(0,0,0,.4); border:none; border-radius:50%;
      width:32px; height:32px; color:#fff; font-size:1rem; cursor:pointer;
      display:flex; align-items:center; justify-content:center; z-index:10;
      transition:background .15s;
    }
    .modal-close:hover { background:rgba(0,0,0,.7); }

    /* Cover hero at top of modal */
    .modal-cover-wrap {
      width:100%; height:200px; position:relative; background:#0a1525;
      display:flex; align-items:center; justify-content:center; overflow:hidden;
    }
    .modal-cover-bg {
      position:absolute; inset:0; background-size:cover; background-position:center;
      filter:blur(20px) brightness(.4); transform:scale(1.1);
    }
    .modal-cover-img {
      position:relative; height:180px; width:auto; max-width:130px;
      object-fit:contain; border-radius:6px;
      box-shadow:0 8px 32px rgba(0,0,0,.7);
    }
    .modal-cover-placeholder {
      position:relative; font-size:4rem; opacity:.3;
    }

    .modal-body { padding:24px 28px 28px; }
    .modal-level-badge {
      display:inline-block; padding:4px 14px; border-radius:20px;
      font-size:.72rem; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
      margin-bottom:12px;
    }
    .modal-title  { font-size:1.5rem; font-weight:900; color:#fff; line-height:1.2; margin-bottom:5px; }
    .modal-author { color:rgba(255,255,255,.55); font-size:.9rem; margin-bottom:18px; }
    .modal-stats  { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:18px; }
    .modal-stat   { background:rgba(255,255,255,.07); border-radius:12px; padding:12px; text-align:center; }
    .modal-stat-val { font-size:1.25rem; font-weight:800; color:#fff; }
    .modal-stat-lbl { font-size:.65rem; color:rgba(255,255,255,.45); margin-top:2px; letter-spacing:.04em; text-transform:uppercase; }
    .modal-desc   { color:rgba(255,255,255,.7); font-size:.88rem; line-height:1.65; border-top:1px solid rgba(255,255,255,.1); padding-top:16px; }

    /* Level colours */
    .lvl-starter { background:#2d6a4f; color:#95e8c5; }
    .lvl-stage1  { background:#1d4e89; color:#90c3ff; }
    .lvl-stage2  { background:#6b2d8b; color:#d8a4ff; }
    .lvl-stage3  { background:#7a3500; color:#ffb570; }
    .lvl-stage4  { background:#7a1e1e; color:#ffb0b0; }

    .book-starter { background:linear-gradient(180deg,#3a8c66 0%,#2d6a4f 100%); }
    .book-stage1  { background:linear-gradient(180deg,#2e6ec4 0%,#1d4e89 100%); }
    .book-stage2  { background:linear-gradient(180deg,#9b4dca 0%,#6b2d8b 100%); }
    .book-stage3  { background:linear-gradient(180deg,#d4611a 0%,#7a3500 100%); }
    .book-stage4  { background:linear-gradient(180deg,#c0392b 0%,#7a1e1e 100%); }

    .pill-starter { background:rgba(61,140,102,.25); color:#95e8c5; border-color:rgba(61,140,102,.4); }
    .pill-stage1  { background:rgba(46,110,196,.25); color:#90c3ff; border-color:rgba(46,110,196,.4); }
    .pill-stage2  { background:rgba(155,77,202,.25); color:#d8a4ff; border-color:rgba(155,77,202,.4); }
    .pill-stage3  { background:rgba(212,97,26,.25);  color:#ffb570; border-color:rgba(212,97,26,.4); }
    .pill-stage4  { background:rgba(192,57,43,.25);  color:#ffb0b0; border-color:rgba(192,57,43,.4); }
  </style>
</head>

</div>

};

const SHELF_ORDER  = ['Stage 4','Stage 3','Stage 2','Stage 1','Starter'];
const BOOK_HEIGHTS = { 'Stage 4':138, 'Stage 3':124, 'Stage 2':110, 'Stage 1':96, 'Starter':82 };

const BOOK_W = 44;  // px per book spine + gap
const BOOK_GAP = 5;

function buildShelf() {
  const room = document.getElementById('shelfRoom');
  room.innerHTML = '';

  // Width = widest shelf (Stage 1 or Stage 2 — whichever has more books)
  const maxBooks = Math.max(
    BOOKS.filter(b => b.level === 'Stage 1').length,
    BOOKS.filter(b => b.level === 'Stage 2').length
  );
  const shelfWidth = maxBooks * (BOOK_W + BOOK_GAP) + 20; // +padding
  room.style.width = shelfWidth + 'px';

  SHELF_ORDER.forEach(level => {
    const books = BOOKS.filter(b => b.level === level);
    if (!books.length) return;

    const info   = LEVEL_INFO[level];
    const height = BOOK_HEIGHTS[level];

    const section = document.createElement('div');
    section.className = 'shelf-section';

    const label = document.createElement('div');
    label.className = 'shelf-label';
    label.textContent = level;
    section.appendChild(label);

    const plank = document.createElement('div');
    plank.className = 'shelf-plank';
    plank.style.height = (height + 14) + 'px';  // fixed height per shelf

    books.forEach(book => {
      const bookEl = document.createElement('div');
      bookEl.className = 'book';
      bookEl.style.height = height + 'px';
      bookEl.style.width  = BOOK_W + 'px';
      bookEl.onclick = () => openModal(book);

      const inner = document.createElement('div');
      inner.className = `book-inner book-${info.cls}`;

      const spine = document.createElement('div');
      spine.className = 'book-title-spine';
      spine.textContent = book.title;

      const coverImg = book.cover
        ? `<img class="tt-cover" src="${book.cover}" alt="" loading="lazy" onerror="this.style.display='none'">`
        : '';

      const tooltip = document.createElement('div');
      tooltip.className = 'book-tooltip';
      tooltip.innerHTML = `
        ${coverImg}
        <div class="tt-body">
          <div class="tt-title">${book.title}</div>
          <div class="tt-author">${book.author.split('/')[0].trim()}</div>
          <div class="tt-meta">
            <span class="tt-badge">${book.level}</span>
            <span class="tt-badge">${book.pages}pp</span>
            <span class="tt-badge">CEFR ${book.cefr}</span>
          </div>
          <div class="tt-cta">Click to learn more →</div>
        </div>`;

      inner.appendChild(spine);
      bookEl.appendChild(inner);
      bookEl.appendChild(tooltip);
      plank.appendChild(bookEl);
    });

    section.appendChild(plank);
    const edge = document.createElement('div');
    edge.className = 'shelf-edge';
    section.appendChild(edge);

    room.appendChild(section);
  });
}

function openModal(book) {
  const info = LEVEL_INFO[book.level];

  // Cover image + blurred background
  const img = document.getElementById('mCoverImg');
  const bg  = document.getElementById('mCoverBg');
  const fb  = document.getElementById('mCoverFallback');
  if (book.cover) {
    img.src = book.cover;
    img.alt = book.title;
    img.style.display = 'block';
    bg.style.backgroundImage = `url('${book.cover}')`;
    fb.style.display = 'none';
  } else {
    img.style.display = 'none';
    bg.style.backgroundImage = '';
    fb.style.display = 'block';
  }

  document.getElementById('mLevel').textContent  = book.level;
  document.getElementById('mLevel').className    = `modal-level-badge lvl-${info.cls}`;
  document.getElementById('mTitle').textContent  = book.title;
  document.getElementById('mAuthor').textContent = book.author;
  document.getElementById('mPages').textContent  = book.pages;
  document.getElementById('mWords').textContent  = book.words.toLocaleString();
  document.getElementById('mCefr').textContent   = book.cefr;
  document.getElementById('mDesc').textContent   = book.blurb || 'A graded reader from the Oxford Bookworms Library.';

  document.getElementById('modalOverlay').classList.add('open');
}

function closeModal(e) {
  if (e.target === document.getElementById('modalOverlay'))
    document.getElementById('modalOverlay').classList.remove('open');
}
function closeModalBtn() {
  document.getElementById('modalOverlay').classList.remove('open');
}

buildShelf();
</script>
</body>
</html>
